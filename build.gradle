plugins {
  id 'org.scm-manager.smp' version '0.17.1'
}

dependencies {
  implementation 'net.sourceforge.plantuml:plantuml-mit:1.2025.10'
}

repositories {
  mavenLocal()
}

scmPlugin {
  scmVersion = "3.0.0"
  displayName = "Markdown PlantUML"
  description = "Enables plant uml rendering in markdown files."
  author = "Cloudogu GmbH"
  category = "Documentation"
  avatarUrl = '/images/markdown-plantuml-logo.png'
}
